<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kartik Kamboj Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;}
body{
    background:radial-gradient(circle at 50% -10%,rgba(0,100,255,.12),transparent 32%),#020817;
    color:#fff;font-family:Inter,Arial,sans-serif;overflow-x:hidden;
}
.top-header{
    width:100%;min-height:240px;position:relative;display:flex;align-items:center;justify-content:center;padding-top:20px;overflow:hidden;
}
.top-header::before{
    content:"";position:absolute;width:600px;height:240px;top:-80px;left:50%;transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(0,125,255,.20),rgba(0,70,255,.06) 45%,transparent 75%);
    filter:blur(10px);pointer-events:none;
}
.menu-btn{
    position:absolute;left:35px;top:50%;transform:translateY(-50%);width:42px;height:35px;display:flex;flex-direction:column;justify-content:space-between;padding:3px 0;cursor:pointer;z-index:20;
}
.menu-btn span{
    display:block;width:42px;height:4px;background:#e8f4ff;border-radius:10px;box-shadow:0 0 5px #fff,0 0 12px #39aaff;
}
.header-icons{
    position:absolute;right:35px;top:50%;transform:translateY(-50%);display:flex;gap:24px;align-items:center;z-index:20;
}
.header-icon{width:36px;height:36px;position:relative;}
.sun{
    border:3px solid #dcecff;border-radius:50%;width:18px;height:18px;position:absolute;top:9px;left:9px;box-shadow:0 0 8px rgba(150,210,255,.5);
}
.sun::before,.sun::after{
    content:"";position:absolute;inset:-9px;border:2px solid transparent;border-top-color:#dcecff;border-bottom-color:#dcecff;
}
.sun::after{transform:rotate(90deg);}
.user-icon{
    width:18px;height:18px;border:3px solid #dcecff;border-radius:50%;position:absolute;left:9px;top:3px;
}
.user-icon::after{
    content:"";position:absolute;width:28px;height:15px;left:-8px;top:20px;border:3px solid #dcecff;border-bottom:0;border-radius:18px 18px 0 0;
}
.logo-area{
    position:relative;width:min(520px,85vw);height:160px;display:flex;justify-content:center;align-items:center;
}
.logo{position:relative;text-align:center;}
.logo-line{
    display:block;position:relative;font-family:"Bowlby One",Impact,sans-serif;font-size:clamp(38px,7.5vw,60px);line-height:1.05;letter-spacing:-1px;font-weight:400;white-space:nowrap;
}
.logo-line:first-child{
    background:linear-gradient(180deg,#ffffff 0%,#d9f0ff 30%,#66bfff 60%,#007cff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #bce8ff;
    text-shadow:0 0 4px #fff,0 0 10px #fff,0 0 20px #008cff;
}
.logo-line:last-child{
    margin-top:4px;
    background:linear-gradient(180deg,#ffffff 0%,#b8e8ff 28%,#00baff 60%,#0068ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #80dcff;
    text-shadow:0 0 4px #fff,0 0 10px #00d0ff,0 0 22px #008cff;
}
.crown{
    position:absolute;top:-42px;left:50%;transform:translateX(-50%);font-size:42px;color:#28b9ff;
    text-shadow:0 0 6px #fff,0 0 15px #00aaff;
}
.logo-line-glow{
    position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:320px;max-width:80vw;height:3px;
    background:linear-gradient(90deg,transparent,#007aff,#fff,#00baff,transparent);
    box-shadow:0 0 6px #00aaff,0 0 18px #008cff;
}
.container{width:min(900px,calc(100% - 80px));margin:0 auto;}
.quick-links{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;margin-bottom:30px;}
.quick-btn{
    min-height:85px;border-radius:20px;display:flex;align-items:center;justify-content:flex-start;padding:0 35px;gap:20px;
    color:#fff;text-decoration:none;font-size:26px;font-weight:700;border:2px solid rgba(255,255,255,.35);
    box-shadow:inset 0 0 20px rgba(255,255,255,.10),0 0 12px rgba(0,100,255,.45);
}
.discord{background:linear-gradient(135deg,#5865f2,#2749dc);box-shadow:0 0 12px #4265ff;}
.reddit{background:linear-gradient(135deg,#ff5b16,#ff3200);box-shadow:0 0 12px #ff5425;}
.nebulo{background:linear-gradient(135deg,#9753ff,#6828dc);box-shadow:0 0 12px #8e46ff;}
.donations{background:linear-gradient(135deg,#52c557,#16a934);box-shadow:0 0 12px #25d94c;}
.btn-icon{font-size:36px;width:40px;text-align:center;}
.section-title{position:relative;font-size:32px;font-weight:800;margin:10px 0 30px;padding-bottom:12px;}
.section-title::after{
    content:"";position:absolute;left:0;bottom:0;width:300px;max-width:65%;height:4px;
    background:linear-gradient(90deg,#00aaff,#08cfff,transparent);box-shadow:0 0 6px #00baff;
}
.section-title::before{content:"🎮";margin-right:15px;font-size:32px;}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding-bottom:60px;}
.game-card{
    position:relative;min-width:0;overflow:hidden;border-radius:20px;background:#030b18;border:2px solid #064cae;
    box-shadow:0 0 5px rgba(0,102,255,.6);
}
.game-image{position:relative;width:100%;aspect-ratio:1.45 / 1;overflow:hidden;}
.game-image img{width:100%;height:100%;display:block;object-fit:cover;}
.game-image::after{
    content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.15) 60%,rgba(0,0,0,.88) 100%);
}
.version{
    position:absolute;right:12px;top:12px;z-index:5;background:#00d84f;color:white;padding:8px 14px;border-radius:8px;font-size:18px;font-weight:800;
    box-shadow:0 0 10px rgba(0,255,100,.45);
}
.game-info{position:relative;margin-top:-80px;z-index:4;padding:60px 24px 22px;}
.category{font-size:16px;letter-spacing:2px;color:#c8d1dc;margin-bottom:10px;}
.game-title{font-size:24px;line-height:1.15;font-weight:800;margin-bottom:10px;}
.game-meta{display:flex;gap:16px;font-size:18px;color:#d7dde6;}

@media(max-width:700px){
    .container{width:calc(100% - 40px);}
    .quick-links{grid-template-columns:1fr;gap:16px;}
    .quick-btn{min-height:75px;font-size:22px;padding:0 25px;}
    .games-grid{grid-template-columns:1fr;gap:20px;}
    .logo-line{font-size:clamp(32px,8vw,48px);}
}
</style>
</head>
<body>
<header class="top-header">
    <div class="menu-btn"><span></span><span></span><span></span></div>
    <div class="logo-area">
        <div class="logo">
            <div class="crown">♛</div>
            <span class="logo-line">KARTIK</span>
            <span class="logo-line">KAMBOJ</span>
        </div>
        <div class="logo-line-glow"></div>
    </div>
    <div class="header-icons">
        <div class="header-icon"><div class="sun"></div></div>
        <div class="header-icon"><div class="user-icon"></div></div>
    </div>
</header>
<main class="container">
    <section class="quick-links">
        <a href="#" class="quick-btn discord"><span class="btn-icon">🎮</span><span>Discord</span></a>
        <a href="#" class="quick-btn reddit"><span class="btn-icon">●</span><span>Reddit</span></a>
        <a href="#" class="quick-btn nebulo"><span class="btn-icon">♧</span><span>Nebulo</span></a>
        <a href="#" class="quick-btn donations"><span class="btn-icon">$</span><span>Donations</span></a>
    </section>
    <h2 class="section-title">Trending Games</h2>
    <section class="games-grid">
        <article class="game-card">
            <div class="game-image">
                <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=600&auto=format&fit=crop&q=60" alt="Nivalis Nights">
                <span class="version">B 25603526</span>
            </div>
            <div class="game-info">
                <div class="category">ADVENTURE</div>
                <h3 class="game-title">Nivalis Nights</h3>
                <div class="game-meta"><span>2026</span><span>|</span><span>16.8 GB</span></div>
            </div>
        </article>
        <article class="game-card">
            <div class="game-image">
                <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=600&auto=format&fit=crop&q=60" alt="Minecraft Dungeons II">
                <span class="version">V 1.1.1.0</span>
            </div>
            <div class="game-info">
                <div class="category">ACTION</div>
                <h3 class="game-title">Minecraft Dungeons II</h3>
                <div class="game-meta"><span>2026</span><span>|</span><span>8.7 GB</span></div>
            </div>
        </article>
    </section>
</main>
</body>
</html>
